<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <title>Daily Gujarati Verse</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Gujarati Sangam MN', 'Shruti', 'Noto Sans Gujarati', sans-serif;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        #verse-container {
            font-size: 2.5rem;
            line-height: 1.6;
            max-width: 800px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            animation: fadeIn 2s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="verse-container">મુખપૃષ્ઠ લોડ થઈ રહ્યું છે... (Loading...)</div>

    <script>
        // 1. Fetch the text file containing the verses
        fetch('verses.txt')
            .then(response => {
                if (!response.ok) {
                    throw new Error("Could not find the verses.txt file.");
                }
                return response.text();
            })
            .then(text => {
                // Split the text file by new lines and clean empty lines
                const verses = text.split('\n')
                                   .map(line => line.trim())
                                   .filter(line => line.length > 0);

                if (verses.length === 0) {
                    document.getElementById('verse-container').innerText = "ટેક્સ્ટ ફાઇલમાં કોઈ પંક્તિઓ મળી નથી.";
                    return;
                }

                // 2. Retrieve the last stored index from the browser's localStorage
                let storedIndex = localStorage.getItem('currentVerseIndex');
                
                // If it doesn't exist yet, start at 0. Otherwise, parse it to an integer.
                let currentIndex = storedIndex ? parseInt(storedIndex, 10) : 0;

                // Safety check: If the index is out of bounds (e.g., you deleted lines in verses.txt), reset to 0
                if (currentIndex >= verses.length || currentIndex < 0) {
                    currentIndex = 0;
                }

                // 3. Display the current sequential verse on the screen
                document.getElementById('verse-container').innerText = verses[currentIndex];

                // 4. Calculate the next index and update localStorage for the next hit
                // The '%' (modulo) operator automatically resets the index back to 0 when it hits the end
                let nextIndex = (currentIndex + 1) % verses.length;
                localStorage.setItem('currentVerseIndex', nextIndex);
            })
            .catch(error => {
                document.getElementById('verse-container').innerText = "ભૂલ: verses.txt ફાઇલ લોડ કરવામાં સમસ્યા આવી છે.";
                console.error(error);
            });
    </script>

</body>
</html>
